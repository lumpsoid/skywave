name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RINF_CLI_VERSION: 8.11.0

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the version
        id: v
        run: |
          scripts/version.sh check
          full=$(scripts/version.sh show)
          version=${full%%+*}
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (Cargo.toml's rust-version)
        run: |
          v=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$v" --profile minimal -t "${{ matrix.target }}"
          rustup default "$v"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Static musl binaries through zig, as scripts/deploy/deploy.sh builds.
      - name: Install cargo-zigbuild
        run: pip install ziglang cargo-zigbuild
      - name: Build
        run: cargo zigbuild --release --locked -p skywaved -p skywave-tui --target "${{ matrix.target }}"
      - name: Package
        run: |
          name="skywave-${{ needs.version.outputs.version }}-${{ matrix.arch }}-linux"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/skywaved" \
             "target/${{ matrix.target }}/release/skywave-tui" \
             LICENSE-MIT LICENSE-APACHE README.md CHANGELOG.md \
             contrib/systemd/skywaved.service \
             "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to build without the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::secret $name is not set; a release is never signed with the debug key"
              exit 1
            fi
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Rust (Cargo.toml's rust-version)
        run: |
          v=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$v" --profile minimal \
            -t aarch64-linux-android -t armv7-linux-androideabi -t x86_64-linux-android
          rustup default "$v"
          # cargokit builds with the stable toolchain.
          rustup toolchain install stable --profile minimal \
            -t aarch64-linux-android -t armv7-linux-androideabi -t x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: Install the rinf CLI
        run: cargo install rinf_cli --version "$RINF_CLI_VERSION" --locked
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Write the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/upload.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > gui/android/key.properties
      - name: Build
        working-directory: gui
        run: |
          flutter pub get
          rinf gen
          flutter build apk --release
      - name: Check the signature
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          apk=gui/build/app/outputs/flutter-apk/app-release.apk
          certs=$("$tools/apksigner" verify --print-certs "$apk")
          echo "$certs"
          if echo "$certs" | grep -q 'CN=Android Debug'; then
            echo "::error::the APK is signed with the debug key"
            exit 1
          fi
          mkdir -p dist
          cp "$apk" "dist/skywave-${{ needs.version.outputs.version }}.apk"
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" gui/android/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  publish:
    needs: [version, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # actions/checkout drops the tag's annotation; fetch the tag itself.
      - name: Release notes from the tag
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: skywave ${{ needs.version.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          files: dist/*
          fail_on_unmatched_files: true
