name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A work branch's gate, run by hand: gh workflow run CI --ref <branch>.
  workflow_dispatch:
  # release.yml runs every gate on the tagged commit.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # rinf's CLI must match the rinf crate (Cargo.toml) and the vendored Dart
  # package (gui/third_party/rinf); see docs/maintaining.md.
  RINF_CLI_VERSION: 8.11.0

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (Cargo.toml's rust-version)
        run: |
          v=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$v" --profile minimal -c clippy -c rustfmt
          rustup default "$v"
      - uses: Swatinem/rust-cache@v2
      - name: Versions agree
        run: scripts/version.sh check
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  gui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (Cargo.toml's rust-version)
        working-directory: .
        run: |
          v=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$v" --profile minimal
          rustup default "$v"
      - name: Cache the rinf CLI
        id: rinf-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/rinf
          key: rinf-cli-${{ env.RINF_CLI_VERSION }}-${{ runner.os }}
      - name: Install the rinf CLI
        if: steps.rinf-cache.outputs.cache-hit != 'true'
        run: cargo install rinf_cli --version "$RINF_CLI_VERSION" --locked
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: 3.50 deadlocks on Linux Wayland (flutter/flutter#196529);
          # see docs/maintaining.md before moving it.
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      # The Dart bindings are generated, not committed.
      - run: rinf gen
      - run: flutter analyze
      - run: flutter test
