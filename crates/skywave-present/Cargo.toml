[package]
name = "skywave-present"
description = "Head-side presentation shared by every head: timeline sections, wording, UTF-16 cursors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Core types only: no UI toolkit, no FFI, no serialisation, so every head
# (terminal, UniFFI, rinf) can use it.
skywave-core.workspace = true
# `strip_ansi`, so a downloaded shell output reads as its preview does.
skywave-proto.workspace = true
# The views' timestamps, for shell run durations and ages.
chrono.workspace = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
