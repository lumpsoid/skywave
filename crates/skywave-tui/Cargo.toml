[package]
name = "skywave-tui"
description = "Skywave terminal head"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
skywave-core.workspace = true
clap.workspace = true
crossterm.workspace = true
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
# Cell widths for laying out wrapped timeline text; already in the tree
# through ratatui.
unicode-width = "0.2"

[dev-dependencies]
# Tests play the engine through `core.seam()`, which speaks proto types.
# The head itself depends on skywave-core only.
skywave-proto.workspace = true
chrono.workspace = true
tempfile.workspace = true
# End-to-end tests (tests/e2e.rs) run a real server with the fake agent.
# Test-only: never a normal dependency.
serde_json.workspace = true
skywaved = { path = "../skywaved" }
skywave-testkit = { path = "../skywave-testkit" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
