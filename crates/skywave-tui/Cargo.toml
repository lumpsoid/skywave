[package]
name = "skywave-tui"
description = "Skywave terminal head"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
skywave-core.workspace = true
# Timeline sections and wording shared with the other heads.
skywave-present.workspace = true
clap.workspace = true
crossterm.workspace = true
# OSC 52 copies are base64.
base64.workspace = true
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
# Cell widths for laying out wrapped timeline text; already in the tree
# through ratatui.
unicode-width = "0.2"
# `strip_ansi` only: a shell run's output blob is raw, and `y` copies it
# stripped, as every head shows it.
skywave-proto.workspace = true
# The wall clock as the shell runs' times (`shell_took`).
chrono.workspace = true

[dev-dependencies]
# Tests play the engine through `core.seam()`, which speaks proto types.
tempfile.workspace = true
rusqlite.workspace = true
# End-to-end tests (tests/e2e.rs) run a real server with the fake agent.
# Test-only: never a normal dependency.
serde_json.workspace = true
skywaved = { path = "../skywaved" }
skywave-testkit = { path = "../skywave-testkit" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
