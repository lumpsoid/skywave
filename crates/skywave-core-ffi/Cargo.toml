[package]
name = "skywave-core-ffi"
description = "UniFFI wrapper over skywave-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# The bindgen CLI, needed only by the `uniffi-bindgen` binary; the library
# build leaves it out.
bindgen = ["uniffi/cli", "uniffi/cargo-metadata"]

[dependencies]
skywave-core.workspace = true
uniffi.workspace = true
chrono.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
