[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
skywave-proto = { path = "crates/skywave-proto" }
skywave-core = { path = "crates/skywave-core" }

axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
x509-parser = "0.18.1"
uuid = { version = "1.29.0", features = ["v7", "serde"] }
getrandom = "0.4.3"
hex = "0.4.3"
qrcode = { version = "0.14.1", default-features = false }
rcgen = { version = "0.14.7", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "time"] }
toml = "1.1.8"
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
