[workspace]
resolver = "3"
members = ["crates/*", "gui/native/hub"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
skywave-proto = { path = "crates/skywave-proto" }
skywave-core = { path = "crates/skywave-core" }
skywave-present = { path = "crates/skywave-present" }

axum = "0.8.9"
base64 = "0.22.1"
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.28.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
x509-parser = "0.18.1"
uuid = { version = "1.29.0", features = ["v7", "serde"] }
getrandom = "0.4.3"
hex = "0.4.3"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
libc = "0.2.191"
pulldown-cmark = { version = "0.13.6", default-features = false }
qrcode = { version = "0.14.1", default-features = false }
ratatui = "0.29.0"
rcgen = { version = "0.14.7", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
rinf = "8.11.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
sha2 = "0.11.1"
signal-hook = "0.3.18"
socket2 = "0.6.5"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "time"] }
toml = "1.1.8"
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Transport compression (D45). The C library, built from source by `cc`
# like rusqlite's bundled SQLite, so Android cross-builds need nothing more.
zstd = { version = "0.14.0", default-features = false }
