// Classes the Compose compiler should treat as stable. Wired in by the
// composeCompiler block in build.gradle.kts.
//
// dev.skywave.core: the UniFFI bindings, generated per build by
// crates/skywave-core-ffi/gen-kotlin.sh. Every value the core hands over is a
// fresh, immutable snapshot (D17), so a stable parameter can skip by equals()
// instead of by identity, and an unchanged row in a new ViewState skips.
//
// Caveat: UniFFI emits top-level records as data classes with `var` fields
// (sealed-class variants use `val`), and their lists are plain List. That is
// sound here only because nothing on the Kotlin side ever assigns to a field
// of, or mutates a list inside, a core value; keep it that way. SkywaveCore and
// ViewListenerImpl (FFI handles, not snapshots) also match the wildcard; they
// never reach a composable, and if they do, equals() on them is identity anyway.
//
// kotlin.collections.List is deliberately not listed: that would vouch for
// every List in the app, not just the core's snapshots.
dev.skywave.core.*
